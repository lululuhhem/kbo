<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="ratings.js"></script>
<script src="players.js"></script>
<script id="engine">
/* ===== 경기 시뮬레이션 엔진 (방장 기기에서만 실행) ===== */
const Engine = (() => {
  const z = x => (x - 50) / 25;
  const R = () => Math.random();
  const pick = a => a[Math.floor(R() * a.length)];
  const POS_KO = { C: '포수', '1B': '1루수', '2B': '2루수', '3B': '3루수', SS: '유격수', LF: '좌익수', CF: '중견수', RF: '우익수', DH: '지명타자', P: '투수' };
  const DEF_W = { C: 1.3, SS: 1.4, CF: 1.2, '2B': 1.1, '3B': 1.0, RF: 0.8, LF: 0.7, '1B': 0.5 };

  function teamDefense(bat, H) {
    let s = 0, w = 0;
    bat.forEach(x => { if (x.pos === 'DH') return; const h = H(x.id); const d = x.emg ? 20 : h.r.d; s += d * (DEF_W[x.pos] || 1); w += (DEF_W[x.pos] || 1); });
    return w ? s / w : 50;
  }

  // 한 타석 결과
  function plateAppearance(b, p, def, tired) {
    const stf = p.stf - tired, ctl = p.ctl - tired * 0.6;
    const K = 0.172 * Math.exp(0.36 * z(stf) - 0.36 * z(b.c));
    const BB = 0.088 * Math.exp(0.33 * z(b.e) - 0.38 * z(ctl));
    const HBP = 0.011;
    const HR = 0.028 * Math.exp(0.55 * z(b.p) - 0.28 * z(stf) - 0.08 * z(ctl));
    let r = R();
    if ((r -= K) < 0) return 'K';
    if ((r -= BB) < 0) return 'BB';
    if ((r -= HBP) < 0) return 'HBP';
    if ((r -= HR) < 0) return 'HR';
    const babip = 0.315 + 0.03 * z(b.c) + 0.01 * z(b.s) - 0.012 * z(stf) - 0.014 * z(def);
    if (R() < babip) {
      const t3 = Math.max(0.003, Math.min(0.06, 0.018 + 0.014 * z(b.s)));
      const t2 = Math.max(0.08, Math.min(0.33, 0.19 + 0.05 * z(b.p)));
      const q = R();
      if (q < t3) return '3B';
      if (q < t3 + t2) return '2B';
      return '1B';
    }
    if (R() < 0.013 * (1 - 0.35 * z(def))) return 'E';
    const q = R();
    return q < 0.45 ? 'GO' : q < 0.81 ? 'FO' : 'LO';
  }

  /* team: { name, bat:[{id,pos,emg}], sp, pen:[id], cp }
     H(id)/Pt(id): 능력치 {n, r:{...}} (컨디션 반영)  */
  function playGame(home, away, H, Pt, opt) {
    opt = opt || {};
    const maxInn = opt.maxInn || 11;
    const T = [away, home]; // 0 원정(초), 1 홈(말)
    const score = [0, 0], line = [[], []], hits = [0, 0], errs = [0, 0];
    const ptr = [0, 0];
    const log = [];
    const box = {}; // id -> 기록
    const bx = id => box[id] || (box[id] = { PA: 0, AB: 0, H: 0, '2B': 0, '3B': 0, HR: 0, R: 0, RBI: 0, BB: 0, SO: 0, SB: 0 });
    const px = id => box[id] || (box[id] = { P: 1, G: 1, GS: 0, OUTS: 0, H: 0, ER: 0, BB: 0, SO: 0, HR: 0, NP: 0, W: 0, L: 0, SV: 0, HLD: 0 });
    const def = [teamDefense(away.bat, H), teamDefense(home.bat, H)];
    const catcherD = [0, 1].map(t => { const c = T[t].bat.find(x => x.pos === 'C'); return c ? (c.emg ? 20 : H(c.id).r.d) : 40; });
    // 투수 상태
    const mound = [null, null]; // 수비팀 기준 현재 투수
    const usedPen = [new Set(), new Set()];
    const pitchers = [[], []];
    function enter(t, id, isStart) {
      const lead = score[t] - score[1 - t];
      const o = { id, np: 0, outs: 0, runs: 0, start: !!isStart, enterLead: lead, enterInn: 0 };
      mound[t] = o; pitchers[t].push(o);
      const s = px(id); if (isStart) s.GS = 1;
      if (!isStart) usedPen[t].add(id);
    }
    enter(0, away.sp, true); enter(1, home.sp, true);
    const spLimit = t => 78 + Pt(T[t].sp).r.sta * 0.45;
    function availablePen(t) { return T[t].pen.filter(id => !usedPen[t].has(id) && id !== T[t].sp); }
    function chooseReliever(t, inn) {
      const av = availablePen(t); if (!av.length) return null;
      const lead = score[t] - score[1 - t];
      const val = id => { const r = Pt(id).r; return r.stf * 0.56 + r.ctl * 0.44; };
      const cp = T[t].cp;
      if (inn >= 9 && lead >= 1 && lead <= 3 && cp && av.includes(cp)) return cp;
      const noCp = av.filter(id => id !== cp);
      const list = (noCp.length ? noCp : av).slice().sort((a, b) => val(b) - val(a));
      if (inn >= 7 && Math.abs(lead) <= 3) return list[0];
      if (Math.abs(lead) >= 5) return list[list.length - 1];
      return list[Math.min(list.length - 1, Math.floor(list.length / 2))];
    }
    function maybeChange(t, inn, atInningStart) {
      const m = mound[t]; const r = Pt(m.id).r;
      let need = false;
      if (m.start) {
        if (m.np >= spLimit(t)) need = true;
        else if (m.runs >= 7 || (m.runs >= 5 && m.np > 60)) need = true;
        else if (atInningStart && inn >= 9 && T[t].cp && !usedPen[t].has(T[t].cp)) { const lead = score[t] - score[1 - t]; if (lead >= 1 && lead <= 3 && m.np > 85) need = true; }
      } else {
        const lim = 14 + r.sta * 0.6;
        if (m.np >= lim) need = true;
        else if (atInningStart && m.outs >= 3 && !(m.id === T[t].cp)) need = true;
        else if (atInningStart && inn >= 9 && T[t].cp && m.id !== T[t].cp && !usedPen[t].has(T[t].cp)) { const lead = score[t] - score[1 - t]; if (lead >= 1 && lead <= 3) need = true; }
      }
      if (!need) return;
      const nid = chooseReliever(t, inn);
      if (!nid) return;
      closeOut(t);
      enter(t, nid, false);
      mound[t].enterInn = inn;
      log.push(`  🔄 투수 교체: ${Pt(nid).n}`);
    }
    function closeOut(t) {
      const m = mound[t]; const lead = score[t] - score[1 - t];
      m.exitLead = lead;
    }
    // 승패 추적
    let potW = [null, null], potL = [null, null];
    let leader = 0; // 0 동점, 1 원정리드, 2 홈리드
    function checkLead(bt) {
      const nl = score[0] === score[1] ? 0 : score[0] > score[1] ? 1 : 2;
      if (nl !== leader && nl !== 0) {
        const lt = nl - 1, tt = 1 - lt; // 리드팀, 열세팀
        potW[lt] = mound[lt] ? mound[lt].id : null; // 리드팀 현재 투수(수비 마지막)
        potL[tt] = mound[tt].id; // 실점한 투수
      }
      leader = nl;
    }
    const DIR1 = ['좌전', '중전', '우전', '유격수 옆', '1·2루간'];
    const DIRX = ['좌중간', '우중간', '좌익선상', '우익선상'];
    const DIRH = ['좌월', '중월', '우월', '좌중월', '우중월'];
    const GOP = ['유격수', '2루수', '3루수', '1루수', '투수'];
    const FOP = ['좌익수', '중견수', '우익수'];
    const LOP = ['유격수 직선타', '2루수 직선타', '3루수 파울플라이', '포수 파울플라이', '1루수 뜬공', '2루수 뜬공'];

    let inn = 1, half = 0, ended = false;
    while (!ended) {
      const bt = half, ft = 1 - half; // 공격팀, 수비팀
      if (inn > 1 || half > 0) maybeChange(ft, inn, true);
      let outs = 0, runs = 0; const bases = [null, null, null];
      log.push(`— ${inn}회${half ? '말' : '초'} ${T[bt].name} 공격 —`);
      const scoreRun = (rid, batterId) => {
        score[bt]++; runs++; bx(rid).R++; if (batterId) bx(batterId).RBI++;
        const m = mound[ft]; m.runs++; px(m.id).ER++;
        checkLead(bt);
      };
      while (outs < 3) {
        // 끝내기
        if (half === 1 && inn >= 9 && score[1] > score[0]) break;
        const slot = T[bt].bat[ptr[bt] % 9]; ptr[bt]++;
        const b = H(slot.id), m = mound[ft], p = Pt(m.id);
        // 도루
        if (bases[0] && !bases[1] && outs < 2) {

    // 처리할 행동
    const pend = MEM.filter(m => m.action && m.action.id && (!S.acted || S.acted[m.uid] !== m.action.id));
    const ph = S.phase;
    let need = pend.length > 0;
    if ((ph === 'draft' || ph === 'fdraft') && now() > S.draft.deadline) need = true;
    if ((ph === 'draft' || ph === 'fdraft')) { const ti = draftTurn(S); const T = S.teams[ti]; const m = MEM.find(x => x.uid === T.uid); if (m && m.opts && m.opts.autoDraft && now() > S.draft.deadline - S.settings.pickTime * 1000 + 1200) need = true; }
    if (ph === 'season') {
      const humans = S.teams.filter(t => !t.ai);
      const allReady = humans.every(t => { const m = MEM.find(x => x.uid === t.uid); return m && (m.ready_day === S.day || (m.opts && m.opts.autoReady)); });
      if (allReady || now() > S.lineDeadline) need = true;

}
function hostProcess(ns, pend) {
  let changed = false;
  ns.acted = ns.acted || {};
  pend.forEach(m => {
    const a = m.action; ns.acted[m.uid] = a.id; changed = true;
    const ti = ns.teams ? ns.teams.findIndex(t => t.uid === m.uid) : -1;
    if (a.type === 'pick' && (ns.phase === 'draft' || ns.phase === 'fdraft') && ti === draftTurn(ns)) {
      if (!canPick(ns, ti, a.pid)) doPick(ns, ti, a.pid, false);
    } else if (a.type === 'fswap' && ns.phase === 'season' && ti >= 0) {
      const err = fswap(ns, ti, a.out, a.in); if (err) news(ns, `⚠️ ${ns.teams[ti].name} 외국인 교체 실패: ${err}`, ti);
    }
  });
  if (ns.phase === 'draft' || ns.phase === 'fdraft') {
    let guard = 0;
    while ((ns.phase === 'draft' || ns.phase === 'fdraft') && guard++ < 400) {
      const ti = draftTurn(ns); const T = ns.teams[ti];
      const m = MEM.find(x => x.uid === T.uid);
      const auto = T.ai || (m && m.opts && m.opts.autoDraft);
      const startAt = ns.draft.deadline - (T.ai ? 500 : ns.settings.pickTime * 1000);
      if (now() > ns.draft.deadline || (auto && now() > startAt + 1100)) {
        const pid = autoPick(ns, ti); if (!pid) break;
        doPick(ns, ti, pid, true); changed = true;
        if (!T.ai) break; // 사람 자동지명은 한 번씩
        if (now() < ns.draft.deadline) break;
      } else break;
    }

    const humans = ns.teams.filter(t => !t.ai);
    const allReady = humans.every(t => { const m = MEM.find(x => x.uid === t.uid); return m && (m.ready_day === ns.day || (m.opts && m.opts.autoReady)); });

  }

}

  on('[data-pid]', 'onclick', e => { if (e.currentTarget.id === 'dopick') return; playerModal(e.currentTarget.dataset.pid); });

      const v = $('#tname').value.trim(); if (v.length < 2) return toast('구단 이름을 2글자 이상 써 주세요');

      if (MEM.some(m => m.uid !== UID && m.team_name === v)) return toast('다른 감독이 쓰는 이름이에요');
      await updateMe({ team_name: v }); toast('저장했어요'); render();
    });
    on('[data-c]', 'onclick', async e => { const c = e.currentTarget.dataset.c; if (!MY_COLORS.includes(c)) return; if (MEM.some(m => m.uid !== UID && m.color === c)) return toast('다른 감독이 쓰는 색이에요'); await updateMe({ color: c }); render(); });
    if (isHost()) {
      const map = { s_teams: 'teams', s_games: 'games', s_roster: 'roster', s_cap: 'cap', s_fslots: 'fslots', s_fcap: 'fcap', s_fswaps: 'fswaps', s_pick: 'pickTime', s_line: 'lineupTime' };

        const domNeed = total * S.settings.roster, domHave = PIDS.filter(id => !PL[id].f).length;
        if (domNeed > domHave) return toast(`국내 선수가 모자라요 (${domHave}명). 팀 수나 인원을 줄여 주세요`);
        if (total * S.settings.fslots > PIDS.filter(id => PL[id].f).length) return toast('외국인 선수가 모자라요');

        L.auto = false; render();
      });
      on('[data-lpl]', 'onchange', e => {

        L.bat[i][0] = id; L.auto = false; render();
      });
      on('[data-up]', 'onclick', e => { const i = +e.currentTarget.dataset.up; if (i > 0) { [L.bat[i - 1], L.bat[i]] = [L.bat[i], L.bat[i - 1]]; L.auto = false; render(); } });
      on('[data-dn]', 'onclick', e => { const i = +e.currentTarget.dataset.dn; if (i < 8) { [L.bat[i + 1], L.bat[i]] = [L.bat[i], L.bat[i + 1]]; L.auto = false; render(); } });
      on('[data-rot]', 'onchange', e => { const i = +e.target.dataset.rot; const v = e.target.value; const j = L.rot.indexOf(v); if (v && j >= 0 && j !== i) L.rot[j] = L.rot[i]; L.rot[i] = v; L.rot = L.rot.slice(0, 5); L.auto = false; render(); });
      on('#lcp', 'onchange', e => { L.cp = e.target.value || null; L.auto = false; });
      on('#lauto', 'onchange', e => { L.auto = e.target.checked; if (L.auto) { const a = autoLineup(S, my); L.bat = a.bat; L.rot = a.rot; L.cp = a.cp; } render(); });
      on('#lautobtn', 'onclick', () => { const a = autoLineup(S, my); L.bat = a.bat; L.rot = a.rot; L.cp = a.cp; render(); toast('최적 라인업으로 바꿨어요'); });
      on('#lsave', 'onclick', async () => {
        const probs = lineupProblems(S, my, L); if (probs.length && !L.auto) return toast(probs[0]);
        const save = L.auto ? { auto: true } : { bat: L.bat, rot: L.rot.filter(Boolean), cp: L.cp || null, auto: false };
        await updateMe({ lineup: save, ready_day: S.day }); toast('저장! 준비 완료'); render();
      });
    }
  }
  if (S.phase === 'done' && isHost()) {
    on('#again', 'onclick', () => { if (!confirm('기록을 지우고 대기실로 돌아갈까요?')) return; commit(ns => { const keep = ns.settings; Object.keys(ns).forEach(k => delete ns[k]); Object.assign(ns, initialState()); ns.settings = keep; }); updateMe({ lineup: null, ready_day: -1, action: null }); });
  }
}


/* ---------- 사진·로고 관리 화면 ---------- */
const UP = { files: [], log: [], busy: false };
function parseMediaName(fname) {
  const base = fname.replace(/\.[^.]+$/, '').normalize('NFC').trim();
  if (KBO_TEAMS.includes(base)) return { kind: 'logo', key: logoKey(base), label: base + ' 로고' };
  const i = base.indexOf('_'); if (i < 0) return null;
  const t = base.slice(0, i), n = base.slice(i + 1);
  const id = n + '@' + t;
  if (!PL[id]) return null;
  return { kind: 'photo', key: photoKey(PL[id]), label: PL[id].dn + ' (' + t + ')' };
}
function mediaView() {
  const total = PIDS.length, have = PIDS.filter(id => MEDIA[photoKey(PL[id])]).length;
  const logos = KBO_TEAMS.filter(t => MEDIA[logoKey(t)]).length;
  const ok = UP.files.filter(f => f.m), bad = UP.files.filter(f => !f.m);
  return `<div class="top"><b>📷 사진·로고 관리</b><button class="btn ghost sm" id="mback">돌아가기</button></div>
  <div class="card"><h3>등록 현황</h3><div>선수 사진 <b>${have}</b> / ${total}명 · 구단 로고 <b>${logos}</b> / 10개</div>
    <p class="note">사진은 잠긴 보관함에 있어서, 이 게임에 접속한 사람만 볼 수 있어요. GitHub에는 올라가지 않아요.</p></div>
  ${IS_ADMIN ? `<div class="card"><h3>사진 올리기</h3>
    <p class="note">파일 이름 규칙 — 선수: <b>구단_이름.jpg</b> (예: KIA_김도영.jpg) · 로고: <b>구단.png</b> (예: 두산.png). 여러 장을 한꺼번에 골라도 돼요. 같은 이름이면 새 사진으로 바뀌어요.</p>
    <input type="file" id="mfiles" accept="image/*" multiple class="wide">
    ${UP.files.length ? `<div class="ok">올릴 수 있는 파일 ${ok.length}개</div>${bad.length ? `<div class="err">이름이 맞지 않는 파일 ${bad.length}개 (건너뜀):<br>${bad.slice(0, 15).map(f => esc(f.f.name)).join(', ')}${bad.length > 15 ? ' …' : ''}</div>` : ''}
    <button class="btn big wide" id="mup" ${UP.busy || !ok.length ? 'disabled' : ''}>${UP.busy ? '올리는 중…' : `⬆️ ${ok.length}개 올리기`}</button>` : ''}
    ${UP.log.length ? `<div class="pbp" style="height:auto;max-height:240px">${UP.log.map(esc).join('<br>')}</div>` : ''}
  </div>` : `<div class="card"><h3>사진 올리기 권한</h3><p>사진은 관리자로 등록된 기기에서만 올릴 수 있어요. 처음 한 번만, 설치한 사람이 Supabase SQL Editor 에서 아래 한 줄을 실행하면 이 기기가 관리자가 돼요.</p>
    <div class="stl" style="word-break:break-all;user-select:all">insert into public.admins(uid) values ('${esc(UID)}');</div>
    <button class="btn ghost wide" id="mcopy">📋 복사하기</button><button class="btn ghost wide" id="mreload">🔄 실행했어요 (다시 확인)</button></div>`}
  ${have ? `<div class="card"><h3>등록된 사진 미리 보기</h3><div class="plist">${PIDS.filter(id => MEDIA[photoKey(PL[id])]).slice(0, 30).map(id => `<div class="prow">${avatar(id)}<div class="pi"><b>${esc(PL[id].dn)}</b> <span class="sub">${logo(PL[id].t)}${esc(PL[id].t)}</span></div></div>`).join('')}</div></div>` : ''}`;
}
function shrink(file, isLogo) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = isLogo ? 160 : 260; const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); if (!isLogo) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), isLogo ? 'image/png' : 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('그림 파일이 아니에요')); };
    img.src = url;
  });
}
function bindMedia() {
  $('#mback').onclick = () => { UI.screen = ROOM ? 'room' : 'home'; render(); };
  const mc = $('#mcopy'); if (mc) mc.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(`insert into public.admins(uid) values ('${UID}');`); toast('복사했어요'); };
  const mr = $('#mreload'); if (mr) mr.onclick = async () => { await loadMedia(); toast(IS_ADMIN ? '관리자로 확인됐어요' : '아직 관리자가 아니에요'); };
  const mf = $('#mfiles'); if (mf) mf.onchange = e => { UP.files = Array.from(e.target.files || []).map(f => ({ f, m: parseMediaName(f.name) })); UP.log = []; render(); };
  const mu = $('#mup'); if (mu) mu.onclick = async () => {
    UP.busy = true; render();
    const list = UP.files.filter(x => x.m); let ok = 0;
    for (const x of list) {
      try {
        const blob = await shrink(x.f, x.m.kind === 'logo');
        const { error } = await sb.storage.from('media').upload(x.m.key, blob, { upsert: true, contentType: x.m.kind === 'logo' ? 'image/png' : 'image/jpeg', cacheControl: '86400' });
        if (error) throw error; ok++; UP.log.unshift('✔ ' + x.m.label);
      } catch (e) { UP.log.unshift('✖ ' + x.f.name + ' — ' + (e.message || e)); }
      if (ok % 10 === 0) render();
    }
    UP.busy = false; UP.files = []; UP.log.unshift(`끝! ${ok}/${list.length}개 올림`);
    await loadMedia();
  };
}

/* ---------- 시작 ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const pb = e.target.closest && e.target.closest('#modal [data-pid]');
  if (pb && pb.id !== 'dopick') playerModal(pb.dataset.pid);
});
render();
(async () => {
  if (!sb) return;
  try {
    let { data } = await sb.auth.getSession();
    let user = data && data.session && data.session.user;
    if (!user) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      user = r.data.user;
    }
    UID = user.id;
    loadMedia();
  } catch (e) { AUTH_ERR = '익명 로그인에 실패했어요: ' + (e.message || e); }
  render();
})();
</script>
</body>
