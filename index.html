<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0d10">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>KBO 감독 리그</title>
<style>
:root{--bg:#0c0d10;--card:#15171c;--card2:#1c1f26;--line:rgba(255,255,255,.07);--tx:#f4f5f7;--sub:#8b93a3;--acc:#ff5a36;--good:#34d399;--bad:#f87171;--gold:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:17px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
#app{max-width:680px;margin:0 auto;padding:12px 14px 104px}
h1{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:4px 0}h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin:4px 0}
h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:2px 0 12px}h4{font-size:15px;font-weight:600;color:var(--sub);margin:16px 0 8px}
.sub{color:var(--sub);font-size:14px}.note{color:var(--sub);font-size:13px;margin:8px 0 0;line-height:1.55}.center{text-align:center}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0}
.hero{padding:40px 4px 14px}.kicker{font-size:13px;font-weight:600;color:var(--acc);letter-spacing:.02em;text-transform:uppercase}.hero p{color:var(--sub);margin:6px 0 0}
#htitle{cursor:default;user-select:none}
/* buttons */
.btn{font:inherit;font-size:16px;font-weight:600;border:0;border-radius:12px;height:48px;padding:0 18px;background:var(--card2);color:var(--tx);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{opacity:.8}.btn:disabled{opacity:.4}
.btn.big,.btn.primary{background:var(--tx);color:#0c0d10;font-weight:700;height:54px;font-size:17px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btn.sm{height:36px;font-size:14px;padding:0 12px;border-radius:9px}.wide{width:100%;display:flex;margin-top:10px}
input,select{font:inherit;font-size:16px;background:var(--card2);color:var(--tx);border:1px solid transparent;border-radius:12px;height:48px;padding:0 14px;min-width:0;outline:none}
input:focus,select:focus{border-color:rgba(255,255,255,.25)}
input[type=checkbox]{height:auto;accent-color:var(--acc)}input[type=file]{height:auto;padding:12px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.row input,.row select{flex:1}
.lb{font-weight:600;font-size:14px;color:var(--sub);margin-bottom:8px;display:block}
.or{text-align:center;color:var(--sub);margin:12px 0;font-size:13px}
.adm{border:1px dashed rgba(255,255,255,.15)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 8px}
.top>div:first-child{display:flex;align-items:center;gap:6px;white-space:nowrap}
.code{font-size:15px;letter-spacing:.12em;font-weight:700}.ph{font-size:13px;color:var(--sub)}
.hostb{font-size:11px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:5px;padding:0 5px}
.tm{flex:1;min-width:0;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;justify-content:flex-end;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.warn{background:#2a1f0a;border-radius:12px;padding:12px;margin:6px 0;font-size:15px}
.bigcode{font-size:46px;font-weight:800;letter-spacing:.16em;margin:4px 0}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.mem:last-child{border:0}
.colors{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.cbtn{width:34px;height:34px;border-radius:10px;border:0;box-shadow:inset 0 0 0 2px transparent}.cbtn.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.set span{flex:1;font-size:15px}.set select{max-width:56%;height:42px;font-size:15px}
.rules{padding-left:18px;margin:0;color:#c9ced8;font-size:15px}.rules li{margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;color:var(--tx);font-weight:600;font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.chip::before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
/* draft turn */
.turn{background:var(--card);border-radius:16px;padding:14px 16px;margin:6px 0 10px;display:grid;grid-template-columns:1fr auto;gap:2px;font-size:14px;color:var(--sub)}
.turn.me{background:linear-gradient(135deg,#3a1408,#15171c 70%);box-shadow:inset 0 0 0 1px rgba(255,90,54,.5)}
.turn .who{grid-column:1/3;font-size:22px;font-weight:700;color:var(--tx);letter-spacing:-.03em}.turn .tmr{grid-row:1;grid-column:2;font-weight:700;color:var(--acc);font-size:16px}
.budget{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:2px 4px 10px;font-size:14px;color:var(--sub)}.budget b{color:var(--tx);font-size:17px}.need{width:100%;color:var(--gold);font-size:13px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0}.tog input{width:18px;height:18px}
.tabs{display:flex;gap:4px;margin:8px 0;background:var(--card);border-radius:12px;padding:4px}.tabb{flex:1;font:inherit;font-size:15px;font-weight:600;height:40px;border-radius:9px;border:0;background:transparent;color:var(--sub)}.tabb.on{background:var(--card2);color:var(--tx)}
.filters{background:var(--card);border-radius:16px;padding:12px;margin:8px 0}
.seg{display:flex;gap:4px;background:var(--card2);border-radius:11px;padding:3px}.seg button{flex:1;font:inherit;font-size:15px;font-weight:600;height:38px;border-radius:8px;border:0;background:transparent;color:var(--sub)}.seg button.on{background:var(--tx);color:#0c0d10}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chips button{font:inherit;font-size:14px;height:34px;padding:0 13px;border-radius:999px;border:0;background:var(--card2);color:var(--sub)}.chips button.on{background:var(--tx);color:#0c0d10;font-weight:700}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:0;border-radius:14px;padding:10px 12px}
.prow:active{background:var(--card2)}
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;font-size:18px;flex:none;overflow:visible;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.av .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50%;background:#e5e7eb}
.av i{position:absolute;right:-3px;bottom:-3px;background:var(--gold);color:#1a1200;font-style:normal;font-size:10px;font-weight:800;border-radius:5px;padding:0 4px;z-index:2}
.lg{vertical-align:-3px;margin-right:4px;object-fit:contain}
.pi{flex:1;min-width:0}.pi b{font-size:17px;font-weight:600}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tg{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--card2);color:var(--sub)}.tg.real{color:var(--blue)}.tg.inj{background:#3b1416;color:var(--bad)}.tg.hot{background:#3a1d0d;color:#fb923c}.tg.cold{background:#0e2440;color:var(--blue)}
.pv{text-align:right;flex:none}.ovr{font-size:22px;font-weight:800;letter-spacing:-.03em}.ovr.big{font-size:36px}.sal{font-size:13px;color:var(--sub);font-weight:500}
.sec{margin:20px 4px 8px;color:var(--sub);font-size:14px;font-weight:600}
.logl{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
/* season status */
.status{background:var(--card);border-radius:16px;padding:14px 16px;margin:6px 0 10px}
.srow{display:flex;justify-content:space-between;align-items:center}.slabel{font-size:13px;color:var(--sub);font-weight:600}.status .tmr{font-size:14px;font-weight:700;color:var(--acc)}
.prog{height:3px;background:var(--card2);border-radius:2px;margin:8px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--tx)}
.snext{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}.snext .chip{font-size:18px;max-width:240px}.snext .chip::before{width:12px;height:12px}
.sact{display:flex;align-items:center;gap:12px}
.rbtn{flex:1;font:inherit;font-size:17px;font-weight:700;height:52px;border-radius:13px;border:0;background:var(--tx);color:#0c0d10}
.rbtn.done{background:var(--card2);color:var(--good)}
.hctl{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.hctl>span{font-size:13px;color:var(--sub);font-weight:600;flex:none}
.seg2{flex:1;display:flex;gap:3px;background:var(--card2);border-radius:11px;padding:3px}.seg2 button{flex:1;font:inherit;font-size:14px;font-weight:600;height:36px;border:0;border-radius:8px;background:transparent;color:var(--tx);white-space:nowrap}.seg2 button:active{background:rgba(255,255,255,.08)}.seg2 button.on{color:var(--acc);flex:3}
.bnav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(12,13,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;max-width:110px;font:inherit;font-size:11px;font-weight:600;color:var(--sub);background:none;border:0;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bnav button.on{color:var(--tx)}
/* tables */
.ls{overflow-x:auto;margin:8px 0}.ls table{border-collapse:collapse;font-size:13px;width:100%}.ls th,.ls td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}.ls th{color:var(--sub);font-weight:500}.ls .tn{text-align:left;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;font-size:14px}.tbl th,.tbl td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th{color:var(--sub);font-weight:500;font-size:12px}.tbl .tn{text-align:left}.tbl tr.mine{background:rgba(255,90,54,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card.half{margin:0;padding:12px}.card.half h4{margin:0 0 6px}
.ldr{display:flex;align-items:center;gap:6px;font-size:14px;padding:3px 0}.ldr>span:first-child{width:16px;color:var(--sub)}.ldr b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}.ldr .sub{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}.ldr em{font-style:normal;font-weight:700}
.news{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.nrow{display:flex;align-items:center;gap:6px}.nrow .nd{width:34px;flex:none;font-size:12px;color:var(--sub)}.nrow .evc{flex:1}
.lrow{display:flex;align-items:center;gap:6px;margin:6px 0}.lrow .ord{width:22px;font-weight:700;text-align:center;color:var(--sub)}.lrow select{height:44px;font-size:15px}.lrow select:first-of-type{width:84px;flex:none}.lrow select:last-of-type{flex:1}
.ud{display:flex;flex-direction:column;gap:2px}.ud button{font-size:11px;width:30px;height:21px;border-radius:6px;border:0;background:var(--card2);color:var(--sub)}
.err{background:#2b1214;color:#fecaca;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}.ok{color:var(--good);margin:10px 0;font-weight:600;font-size:14px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.mbox{background:var(--card);width:100%;max-width:680px;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.pm{display:flex;align-items:center;gap:14px;margin-bottom:12px}.pm>div:nth-child(2){flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}.bar span{width:40px;color:var(--sub)}.bar div{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;border-radius:4px}.bar em{width:28px;text-align:right;font-style:normal;font-weight:700}
.stl{background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}.stl.est{color:var(--sub)}
.pbp{background:#0a0b0e;border-radius:14px;padding:10px 12px;height:52vh;overflow-y:auto;font-size:15px;line-height:1.75}
.pbp .inn{color:var(--sub);font-weight:600;font-size:13px;margin-top:8px}.pbp .hr{color:var(--gold);font-weight:700}.pbp .run{color:var(--good);font-weight:600}.pbp .sub{color:var(--blue)}.pbp .fin{text-align:center;font-weight:700;margin:10px 0}
.champ{text-align:center;padding:30px 16px;background:linear-gradient(160deg,#3b2a0a,#15171c 70%)}.trophy{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.2em}
#toast{pointer-events:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#f4f5f7;color:#0c0d10;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;transition:.2s;z-index:60;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
/* field */
.tpanel{background:var(--card);border-radius:16px;padding:12px;margin:8px 0;position:relative;overflow:hidden}
.tpanel::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--tc)}
.tph{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:4px 4px 8px}.tph b{font-size:20px;font-weight:700;display:block;letter-spacing:-.03em}.tph span{color:var(--sub);font-size:13px}.tpr{text-align:right}.tpr b{font-size:17px}
.capbar{height:3px;background:var(--card2);border-radius:2px;overflow:hidden;margin:0 4px 10px}.capbar i{display:block;height:100%;background:var(--tx)}
.field{position:relative;width:100%;aspect-ratio:1/1.02;border-radius:14px;overflow:hidden;background:#1b4332;margin-bottom:8px}
.fgrass{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#1f4d3a 0 24px,#1b4332 24px 48px)}
.fgrass::after{content:'';position:absolute;left:50%;top:92%;width:150%;height:150%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.1)}
.fdia{position:absolute;left:50%;top:70%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#8a5a2b;border:2px solid rgba(255,255,255,.5);box-shadow:inset 0 0 0 18px #1f4d3a}
.fmound{position:absolute;left:50%;top:70%;width:8%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#9c6634}
.fp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:#fff;font:inherit;padding:0;width:86px;z-index:2}
.fp b{font-size:13px;font-weight:600;background:rgba(0,0,0,.6);border-radius:5px;padding:0 6px;margin-top:2px;white-space:nowrap;max-width:86px;overflow:hidden;text-overflow:ellipsis}
.fp em{font-style:normal;font-size:10px;color:rgba(255,255,255,.75);white-space:nowrap}
.fp.empty{opacity:.5}.eav{background:rgba(0,0,0,.25)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)!important;font-size:11px!important;font-weight:600!important;width:46px;height:46px}
.fdh{position:absolute;right:8px;bottom:8px}.fp.rel{position:static;transform:none}
.st{position:absolute;top:-2px;right:12px;font-style:normal;font-size:10px;border-radius:4px;padding:0 4px;font-weight:700;z-index:3}
.mp .st,.tk .st{right:2px}.st.inj{background:var(--bad);color:#fff}.st.hot{background:#f97316;color:#fff}.st.cold{background:#3b82f6;color:#fff}
.prw{display:flex;align-items:flex-start;gap:6px;padding:8px 2px;border-top:1px solid var(--line)}
.prl{flex:none;width:48px;font-weight:600;font-size:14px;padding-top:12px}.prl i{display:block;font-style:normal;color:var(--sub);font-size:12px;font-weight:400}
.prs{display:flex;gap:2px;overflow-x:auto;padding-bottom:4px;flex:1}
.mp{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;width:62px;background:none;border:0;color:var(--tx);font:inherit;padding:2px}
.mp b{font-size:12px;font-weight:600;white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.mp em{font-style:normal;font-size:11px;color:var(--sub)}
.ttabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.ttabs button{flex:none;font:inherit;font-size:14px;font-weight:600;color:var(--sub);background:var(--card);border:0;border-radius:999px;height:36px;padding:0 14px;display:flex;align-items:center;gap:6px}
.ttabs button::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--tc)}.ttabs button.on{background:var(--tx);color:#0c0d10}
.ticker{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tk{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;width:74px;background:var(--card);border:0;border-radius:14px;padding:8px 2px 7px;color:var(--tx);font:inherit;overflow:hidden}
.tk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--tc)}
.tk b{font-size:13px;font-weight:600;margin-top:4px}.tk em{font-style:normal;font-size:10px;color:var(--sub);max-width:68px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tk.new{box-shadow:inset 0 0 0 1px rgba(255,90,54,.6)}
.hero2,.starc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;font:inherit;color:#fff;border:0;border-radius:18px;padding:16px;margin:8px 0;background:linear-gradient(115deg,color-mix(in srgb,var(--tc,#333) 55%,#15171c),#15171c 75%);position:relative}
.starc{background:linear-gradient(115deg,#4a3410,#15171c 75%)}
.hl{display:inline-block;font-size:12px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:2px}
.hero2 .hl{position:absolute;top:12px;right:14px}
.hn{font-size:24px;font-weight:800;letter-spacing:-.03em}.hs{font-size:14px;color:rgba(255,255,255,.8)}.ht{font-size:13px;color:var(--gold);margin-top:3px}
.rboard{overflow-x:auto;background:var(--card);border-radius:16px}
.rboard table{border-collapse:collapse}.rboard th{color:var(--tx);font-size:12px;font-weight:600;padding:10px 6px 8px;min-width:84px;white-space:nowrap;box-shadow:inset 0 -3px 0 var(--c,transparent)}
.rboard td{border-top:1px solid var(--line);padding:6px 4px;text-align:center}.rboard .rn{color:var(--sub);font-weight:600;position:sticky;left:0;background:var(--card);font-size:13px}
.rc{display:flex;flex-direction:column;align-items:center;background:none;border:0;color:var(--tx);font:inherit;width:80px}.rc b{font-size:12px;font-weight:600;margin-top:3px}.rc em{font-style:normal;font-size:10px;color:var(--sub)}
/* report */
.rep{border-radius:18px;padding:16px;margin:8px 0;background:var(--card)}
.reph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.reph span{color:var(--sub);font-size:13px}.reph b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.rep.win .reph b{color:var(--good)}.rep.lose .reph b{color:var(--sub)}
.sbug{display:flex;align-items:stretch;border-radius:14px;overflow:hidden;background:#0a0b0e;margin:4px 0}
.sbt{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;min-width:0;position:relative}
.sbt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}.sbt.r::before{left:auto;right:0}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="ratings.js"></script>
<script src="players.js"></script>
<script id="engine">
/* ===== 경기 시뮬레이션 엔진 (방장 기기에서만 실행) ===== */
const Engine = (() => {
  const z = x => (x - 50) / 25;
  const R = () => Math.random();
  const pick = a => a[Math.floor(R() * a.length)];
  const POS_KO = { C: '포수', '1B': '1루수', '2B': '2루수', '3B': '3루수', SS: '유격수', LF: '좌익수', CF: '중견수', RF: '우익수', DH: '지명타자', P: '투수' };
  const DEF_W = { C: 1.3, SS: 1.4, CF: 1.2, '2B': 1.1, '3B': 1.0, RF: 0.8, LF: 0.7, '1B': 0.5 };

  function teamDefense(bat, H) {
    let s = 0, w = 0;
    bat.forEach(x => { if (x.pos === 'DH') return; const h = H(x.id); const d = x.emg ? 20 : h.r.d; s += d * (DEF_W[x.pos] || 1); w += (DEF_W[x.pos] || 1); });
    return w ? s / w : 50;
  }

  // 한 타석 결과
  function plateAppearance(b, p, def, tired) {
    const stf = p.stf - tired, ctl = p.ctl - tired * 0.6;
    const K = 0.172 * Math.exp(0.36 * z(stf) - 0.36 * z(b.c));
    const BB = 0.088 * Math.exp(0.33 * z(b.e) - 0.38 * z(ctl));
    const HBP = 0.011;
    const HR = 0.028 * Math.exp(0.55 * z(b.p) - 0.28 * z(stf) - 0.08 * z(ctl));
    let r = R();
    if ((r -= K) < 0) return 'K';
    if ((r -= BB) < 0) return 'BB';
    if ((r -= HBP) < 0) return 'HBP';
    if ((r -= HR) < 0) return 'HR';
    const babip = 0.315 + 0.03 * z(b.c) + 0.01 * z(b.s) - 0.012 * z(stf) - 0.014 * z(def);
    if (R() < babip) {
      const t3 = Math.max(0.003, Math.min(0.06, 0.018 + 0.014 * z(b.s)));
      const t2 = Math.max(0.08, Math.min(0.33, 0.19 + 0.05 * z(b.p)));
      const q = R();
      if (q < t3) return '3B';
      if (q < t3 + t2) return '2B';
      return '1B';
    }
    if (R() < 0.013 * (1 - 0.35 * z(def))) return 'E';
    const q = R();
    return q < 0.45 ? 'GO' : q < 0.81 ? 'FO' : 'LO';
  }

  /* team: { name, bat:[{id,pos,emg}], sp, pen:[id], cp }
     H(id)/Pt(id): 능력치 {n, r:{...}} (컨디션 반영)  */
  function playGame(home, away, H, Pt, opt) {
    opt = opt || {};
    const maxInn = opt.maxInn || 11;
    const T = [away, home]; // 0 원정(초), 1 홈(말)
    const score = [0, 0], line = [[], []], hits = [0, 0], errs = [0, 0];
    const ptr = [0, 0];
    const log = [];
    const box = {}; // id -> 기록
    const bx = id => box[id] || (box[id] = { PA: 0, AB: 0, H: 0, '2B': 0, '3B': 0, HR: 0, R: 0, RBI: 0, BB: 0, SO: 0, SB: 0 });
    const px = id => box[id] || (box[id] = { P: 1, G: 1, GS: 0, OUTS: 0, H: 0, ER: 0, BB: 0, SO: 0, HR: 0, NP: 0, W: 0, L: 0, SV: 0, HLD: 0 });
    const def = [teamDefense(away.bat, H), teamDefense(home.bat, H)];
    const catcherD = [0, 1].map(t => { const c = T[t].bat.find(x => x.pos === 'C'); return c ? (c.emg ? 20 : H(c.id).r.d) : 40; });
    // 투수 상태
    const mound = [null, null]; // 수비팀 기준 현재 투수
    const usedPen = [new Set(), new Set()];
    const pitchers = [[], []];
    function enter(t, id, isStart) {
      const lead = score[t] - score[1 - t];
      const o = { id, np: 0, outs: 0, runs: 0, start: !!isStart, enterLead: lead, enterInn: 0 };
      mound[t] = o; pitchers[t].push(o);
      const s = px(id); if (isStart) s.GS = 1;
      if (!isStart) usedPen[t].add(id);
    }
    enter(0, away.sp, true); enter(1, home.sp, true);
    const spLimit = t => 78 + Pt(T[t].sp).r.sta * 0.45;
    function availablePen(t) { return T[t].pen.filter(id => !usedPen[t].has(id) && id !== T[t].sp); }
    function chooseReliever(t, inn) {
      const av = availablePen(t); if (!av.length) return null;
      const lead = score[t] - score[1 - t];
      const val = id => { const r = Pt(id).r; return r.stf * 0.56 + r.ctl * 0.44; };
      const cp = T[t].cp;
      if (inn >= 9 && lead >= 1 && lead <= 3 && cp && av.includes(cp)) return cp;
      const noCp = av.filter(id => id !== cp);
      const list = (noCp.length ? noCp : av).slice().sort((a, b) => val(b) - val(a));
      if (inn >= 7 && Math.abs(lead) <= 3) return list[0];
      if (Math.abs(lead) >= 5) return list[list.length - 1];
      return list[Math.min(list.length - 1, Math.floor(list.length / 2))];
    }
    function maybeChange(t, inn, atInningStart) {
      const m = mound[t]; const r = Pt(m.id).r;
      let need = false;
      if (m.start) {
        if (m.np >= spLimit(t)) need = true;
        else if (m.runs >= 7 || (m.runs >= 5 && m.np > 60)) need = true;
        else if (atInningStart && inn >= 9 && T[t].cp && !usedPen[t].has(T[t].cp)) { const lead = score[t] - score[1 - t]; if (lead >= 1 && lead <= 3 && m.np > 85) need = true; }
      } else {
        const lim = 14 + r.sta * 0.6;
        if (m.np >= lim) need = true;
        else if (atInningStart && m.outs >= 3 && !(m.id === T[t].cp)) need = true;
        else if (atInningStart && inn >= 9 && T[t].cp && m.id !== T[t].cp && !usedPen[t].has(T[t].cp)) { const lead = score[t] - score[1 - t]; if (lead >= 1 && lead <= 3) need = true; }
      }
      if (!need) return;
      const nid = chooseReliever(t, inn);
      if (!nid) return;
      closeOut(t);
      enter(t, nid, false);
      mound[t].enterInn = inn;
      if (EV) EV('sub', `투수 교체: ${Pt(nid).n}`, '', nid);
    }
    function closeOut(t) {
      const m = mound[t]; const lead = score[t] - score[1 - t];
      m.exitLead = lead;
    }
    // 승패 추적
    let potW = [null, null], potL = [null, null];
    let EV = null;
    let leader = 0; // 0 동점, 1 원정리드, 2 홈리드
    function checkLead(bt) {
      const nl = score[0] === score[1] ? 0 : score[0] > score[1] ? 1 : 2;
      if (nl !== leader && nl !== 0) {
        const lt = nl - 1, tt = 1 - lt; // 리드팀, 열세팀
        potW[lt] = mound[lt] ? mound[lt].id : null; // 리드팀 현재 투수(수비 마지막)
        potL[tt] = mound[tt].id; // 실점한 투수
      }
      leader = nl;
    }
    const DIR1 = ['좌전', '중전', '우전', '유격수 옆', '1·2루간'];
    const DIRX = ['좌중간', '우중간', '좌익선상', '우익선상'];
    const DIRH = ['좌월', '중월', '우월', '좌중월', '우중월'];
    const GOP = ['유격수', '2루수', '3루수', '1루수', '투수'];
    const FOP = ['좌익수', '중견수', '우익수'];
    const LOP = ['유격수 직선타', '2루수 직선타', '3루수 파울플라이', '포수 파울플라이', '1루수 뜬공', '2루수 뜬공'];

    let inn = 1, half = 0, ended = false;
    while (!ended) {
      const bt = half, ft = 1 - half; // 공격팀, 수비팀
      let outs = 0, runs = 0; const bases = [null, null, null];
      const ev = (k, t, b, p) => log.push([k, t, inn, half, outs, (bases[0] ? 1 : 0) | (bases[1] ? 2 : 0) | (bases[2] ? 4 : 0), score[0], score[1], b || '', p || '']);
      EV = ev;
      ev('inn', `${inn}회${half ? '말' : '초'} ${T[bt].name} 공격`, '', mound[ft].id);
      if (inn > 1 || half > 0) maybeChange(ft, inn, true);
      const scoreRun = (rid, batterId) => {
        score[bt]++; runs++; bx(rid).R++; if (batterId) bx(batterId).RBI++;
        const m = mound[ft]; m.runs++; px(m.id).ER++;
        checkLead(bt);
      };
      while (outs < 3) {
        // 끝내기
        if (half === 1 && inn >= 9 && score[1] > score[0]) break;
        const slot = T[bt].bat[ptr[bt] % 9]; ptr[bt]++;
        const b = H(slot.id), m = mound[ft], p = Pt(m.id);
        // 도루
        if (bases[0] && !bases[1] && outs < 2) {
          const rs = H(bases[0]).r.s;
          if (rs > 58 && R() < (rs - 58) / 200) {
            const ok = R() < 0.66 + (rs - 60) / 130 - (catcherD[ft] - 55) / 250;
            if (ok) { bases[1] = bases[0]; bases[0] = null; bx(bases[1]).SB++; ev('sb', `${H(bases[1]).n} 2루 도루 성공`, bases[1], m.id); }
            else { const cs = bases[0]; bases[0] = null; outs++; m.outs++; px(m.id).OUTS++; ev('cs', `${H(cs).n} 도루 실패`, cs, m.id); if (outs >= 3) { ptr[bt]--; break; } }
          }
        }
        const tired = m.start ? Math.max(0, m.np - (spLimit(ft) - 20)) * 0.5 : Math.max(0, m.np - 25) * 0.6;
        const res = plateAppearance(b.r, p.r, def[ft], tired);
        const s = bx(slot.id), ps = px(m.id);
        s.PA++;
        const np = res === 'K' ? 4.6 + R() * 1.5 : res === 'BB' ? 5.4 + R() * 1.2 : 2.8 + R() * 2;
        m.np += np; ps.NP += np;
        const nm = b.n;
        if (res === 'K') { s.AB++; s.SO++; ps.SO++; outs++; m.outs++; ps.OUTS++; ev('k', `${nm}: ${R() < 0.75 ? '헛스윙' : '루킹'} 삼진`, slot.id, m.id); }
        else if (res === 'BB' || res === 'HBP') {
          if (res === 'BB') { s.BB++; ps.BB++; } else { s.BB++; }
          if (bases[0]) { if (bases[1]) { if (bases[2]) scoreRun(bases[2], slot.id); bases[2] = bases[1]; } bases[1] = bases[0]; }
          bases[0] = slot.id;
          ev('bb', `${nm}: ${res === 'BB' ? '볼넷' : '몸에 맞는 공'}`, slot.id, m.id);
        } else if (res === 'HR') {
          s.AB++; s.H++; s.HR++; ps.H++; ps.HR++; hits[bt]++;
          const n = 1 + bases.filter(Boolean).length;
          bases.forEach(r => { if (r) scoreRun(r, slot.id); }); bases[0] = bases[1] = bases[2] = null;
          scoreRun(slot.id, slot.id);
          ev('hr', `${nm}: ${pick(DIRH)} ${n === 4 ? '만루 홈런!!' : n + '점 홈런!'}`, slot.id, m.id);
        } else if (res === '1B' || res === '2B' || res === '3B') {
          s.AB++; s.H++; ps.H++; hits[bt]++;
          if (res === '1B') {
            const r3 = bases[2], r2 = bases[1], r1 = bases[0];
            bases[0] = bases[1] = bases[2] = null;
            if (r3) scoreRun(r3, slot.id);
            if (r2) { if (R() < 0.58 + (H(r2).r.s - 50) / 150) scoreRun(r2, slot.id); else bases[2] = r2; }
            if (r1) { if (!bases[2] && R() < 0.28 + (H(r1).r.s - 50) / 150) bases[2] = r1; else bases[1] = r1; }
            bases[0] = slot.id;
            ev('h', `${nm}: ${pick(DIR1)} 안타`, slot.id, m.id);
          } else if (res === '2B') {
            s['2B']++;
            const r3 = bases[2], r2 = bases[1], r1 = bases[0];
            bases[0] = bases[1] = bases[2] = null;
            if (r3) scoreRun(r3, slot.id); if (r2) scoreRun(r2, slot.id);
            if (r1) { if (R() < 0.42 + (H(r1).r.s - 50) / 120) scoreRun(r1, slot.id); else bases[2] = r1; }
            bases[1] = slot.id;
            ev('h', `${nm}: ${pick(DIRX)} 2루타`, slot.id, m.id);
          } else {
            s['3B']++;
            bases.forEach(r => { if (r) scoreRun(r, slot.id); }); bases[0] = bases[1] = null;
            bases[2] = slot.id;
            ev('h', `${nm}: ${pick(DIRX)} 3루타!`, slot.id, m.id);
          }
        } else if (res === 'E') {
          s.AB++; errs[ft]++;
          if (bases[2]) { scoreRun(bases[2], null); bases[2] = null; }
          if (bases[1]) { bases[2] = bases[1]; bases[1] = null; }
          if (bases[0]) { bases[1] = bases[0]; }
          bases[0] = slot.id;
          ev('e', `${nm}: ${pick(GOP)} 실책으로 출루`, slot.id, m.id);
        } else if (res === 'GO') {
          s.AB++;
          const pos = pick(GOP);
          if (bases[0] && outs < 2 && R() < 0.42 - (b.r.s - 50) / 200) {
            outs += 2; m.outs += 2; ps.OUTS += 2; bases[0] = null;
            if (outs < 3) { if (bases[2]) { scoreRun(bases[2], null); bases[2] = null; } if (bases[1]) { bases[2] = bases[1]; bases[1] = null; } }
            ev('dp', `${nm}: ${pos} 앞 병살타`, slot.id, m.id);
          } else {
            outs++; m.outs++; ps.OUTS++;
            if (outs < 3) {
              if (bases[2] && R() < 0.5) { scoreRun(bases[2], slot.id); bases[2] = null; }

    const pend = MEM.filter(m => m.action && m.action.id && (!S.acted || S.acted[m.uid] !== m.action.id));
    const ph = S.phase;
    let need = pend.length > 0;
    if ((ph === 'draft' || ph === 'fdraft') && now() > S.draft.deadline) need = true;
    if ((ph === 'draft' || ph === 'fdraft')) { const ti = draftTurn(S); const T = S.teams[ti]; const m = MEM.find(x => x.uid === T.uid); if (m && m.opts && m.opts.autoDraft && now() > S.draft.deadline - S.settings.pickTime * 1000 + 1200) need = true; }

      if (allReady || now() > S.lineDeadline) need = true;

function hostProcess(ns, pend) {
  let changed = false;
  ns.acted = ns.acted || {};
  pend.forEach(m => {
    const a = m.action; ns.acted[m.uid] = a.id; changed = true;
    const ti = ns.teams ? ns.teams.findIndex(t => t.uid === m.uid) : -1;
    if (a.type === 'pick' && (ns.phase === 'draft' || ns.phase === 'fdraft') && ti === draftTurn(ns)) {
      if (!canPick(ns, ti, a.pid)) doPick(ns, ti, a.pid, false);
    } else if (a.type === 'fswap' && ns.phase === 'season' && ti >= 0) {
      const err = fswap(ns, ti, a.out, a.in); if (err) news(ns, `${ns.teams[ti].name} 외국인 교체 실패: ${err}`, ti);
    }
  });
  if (ns.phase === 'draft' || ns.phase === 'fdraft') {
    let guard = 0;
    while ((ns.phase === 'draft' || ns.phase === 'fdraft') && guard++ < 400) {
      const ti = draftTurn(ns); const T = ns.teams[ti];
      const m = MEM.find(x => x.uid === T.uid);

}

        [i, j].forEach(k => { if (k < 0) return; const [id, pos] = L.bat[k]; if (pos !== 'DH' && !PL[id].pos.includes(pos)) { const T = S.teams[my]; const used = new Set(L.bat.map(x => x[0])); const sub = [...T.roster, ...T.froster].filter(h => PL[h].k === 'H' && !used.has(h) && !S.inj[h] && PL[h].pos.includes(pos)).sort((a, b) => offense(b) - offense(a))[0]; if (sub) L.bat[k][0] = sub; } });

      on('#lauto', 'onchange', e => { L.auto = e.target.checked; if (L.auto) { const a = autoLineup(S, my); L.bat = a.bat; L.rot = a.rot; L.cp = a.cp; } render(); });

      on('#lsave', 'onclick', async () => {

function shrink(file, isLogo) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = isLogo ? 160 : 260; const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); if (!isLogo) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), isLogo ? 'image/png' : 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('그림 파일이 아니에요')); };
    img.src = url;
  });
}

        ${scorebug(g, true)}${lineScore(g)}
        <div class="dec">${g.W ? `<span class="dw">승 ${esc(PL[g.W].dn)}</span>` : ''}${g.L ? `<span class="dl">패 ${esc(PL[g.L].dn)}</span>` : ''}${g.SV ? `<span class="ds">세 ${esc(PL[g.SV].dn)}</span>` : ''}</div>
        <div class="row"><button class="btn primary" data-pbp="${gi}">중계 ${UI.logShown[L.day + '-' + g.h] ? '다시 보기' : '보기'}</button><button class="btn ghost" data-box="${gi}">박스스코어</button></div>
      </div>`;
      if (star) html += `<button class="starc" data-pid="${esc(star)}">${avatar(star, 78)}<div><span class="hl">오늘의 수훈 선수</span><div class="hn">${esc(PL[star].dn)}</div><div class="hs">${PL[star].k === 'H' ? hLine(sb) : pLine(sb) + (sb[6] ? ' (' + DEC[sb[6]][0] + ')' : '')}</div><div class="ht">시즌 ${seasonLine(star)}</div></div></button>`;
      html += `<div class="card"><h3>우리 타자 오늘 기록</h3>${myBat.map(([id, pos], i) => { const b = g.box[id] || [0, 0, 0, 0, 0, 0, 0]; const good = b[2] > 0 || b[1] >= 2 || b[3] >= 2; const bad = b[0] >= 3 && b[1] === 0;
        return `<button class="prl2 ${good ? 'good' : bad ? 'bad' : ''}" data-pid="${esc(id)}"><span class="ord">${i + 1}</span>${avatar(id, 42)}<div class="pi"><b>${esc(PL[id].dn)}</b> <span class="sub">${POSKO[pos]}</span>${condTag(id)}<div class="tl">${hLine(b)}</div></div><div class="sv"><b>${avgStr(avgOf(S, id))}</b><span>${hsv(S, id, 'HR')}홈런 ${hsv(S, id, 'RBI')}타점</span></div></button>`; }).join('')}</div>`;
      html += `<div class="card"><h3>우리 투수 오늘 기록</h3>${myPit.map((id, i) => { const b = g.box[id] || [0, 0, 0, 0, 0, 0, '']; const d = DEC[b[6]]; const good = b[2] === 0 && b[0] >= 3; const bad = b[2] >= 4;
        return `<button class="prl2 ${good ? 'good' : bad ? 'bad' : ''}" data-pid="${esc(id)}"><span class="ord">${i === 0 ? '선발' : ''}</span>${avatar(id, 42)}<div class="pi"><b>${esc(PL[id].dn)}</b>${d ? ` <i class="dc ${d[1]}">${d[0]}</i>` : ''}${condTag(id)}<div class="tl">${pLine(b)} · ${b[5]}구</div></div><div class="sv"><b>${eraOf(S, id).toFixed(2)}</b><span>${psv(S, id, 'W')}승 ${psv(S, id, 'L')}패 ${psv(S, id, 'SV')}세</span></div></button>`; }).join('')}</div>`;
      if (hl.length) html += `<div class="card"><h3>득점 장면</h3>${hl.map(x => `<div class="hlr ${x.half === side ? 'us' : 'them'}"><span class="hin">${x.inn}회${x.half ? '말' : '초'}</span>${x.bid && PL[x.bid] ? avatar(x.bid, 34) : '<span class="evi"></span>'}<div>${x.k === 'hr' ? '' : ''}${esc(x.t)}</div><b>${x.sa}:${x.sh}</b></div>`).join('')}</div>`;
    } else html += `<div class="card center"><h3>오늘은 경기가 없었어요</h3></div>`;
    const evMine = (L.ev || []).filter(n => n.ti === my), evOther = (L.ev || []).filter(n => n.ti !== my);
    if (evMine.length || evOther.length) html += `<div class="card"><h3>오늘의 소식</h3>${evMine.map(evCard).join('') || '<p class="sub">우리 팀 소식은 없어요</p>'}${evOther.length ? `<details><summary>다른 팀 소식 ${evOther.length}건</summary>${evOther.map(n => evCard(n, true)).join('')}</details>` : ''}</div>`;
    const others = L.games.filter(x => x !== g);
    if (others.length) html += `<div class="card"><h3>다른 경기</h3>${others.map(x => `<button class="gres2" data-box="${L.games.indexOf(x)}">${scorebug(x)}</button>`).join('')}</div>`;
  }
  // 우리 팀 현황 + 다음 상대
  const inj = [...T.roster, ...T.froster].filter(id => S.inj[id]);
  html += `<div class="card"><h3>우리 팀 현황</h3><div class="tiles"><div><b>${rk + 1}위</b><span>순위</span></div><div><b>${T.W}-${T.L}${T.D ? '-' + T.D : ''}</b><span>승-패</span></div><div><b>${T.RS}</b><span>득점</span></div><div><b>${T.RA}</b><span>실점</span></div><div><b>${T.streak || '-'}</b><span>연속</span></div></div>
    ${inj.length ? `<div class="prw"><span class="prl">부상<i>${inj.length}</i></span><div class="prs">${inj.map(id => miniP(id, S.inj[id] + '일')).join('')}</div></div>` : ''}</div>`;
  const ng = nextGameOf(my);
  if (ng) html += `<h4 class="sec">다음 상대 미리 보기</h4>${teamPanel(ng.opp)}`;
  return html;
}

/* ---------- 중계 화면 ---------- */
function pbpModal(i) {
  const g = S.last.games[i]; const key = S.last.day + '-' + g.h;
  const seen = UI.logShown[key]; UI.logShown[key] = 1;
  const A = S.teams[g.a], H = S.teams[g.h]; const log = g.log;
  const ICON = { k: '삼진', bb: '볼넷', hr: '홈런', h: '안타', e: '실책', dp: '병살', out: '아웃', sf: '희플', sb: '도루', cs: '도루자', sub: '교체', run: '득점', end: '끝내기', inn: '' };
  const badge = kind => ICON[kind] ? `<i class="pb ${kind}">${ICON[kind]}</i>` : '';
  $('#modal').innerHTML = `<div class="mbox cast">
    <div class="cbug"><div class="ct" style="--tc:${col(A.color)}"><span>${esc(A.name)}</span><b id="cA">0</b></div>
      <div class="cmid"><div id="cInn">1회초</div>
        <svg viewBox="0 0 60 44" class="dia"><rect id="b2" x="24" y="2" width="12" height="12" transform="rotate(45 30 8)"/><rect id="b3" x="8" y="16" width="12" height="12" transform="rotate(45 14 22)"/><rect id="b1" x="40" y="16" width="12" height="12" transform="rotate(45 46 22)"/></svg>
        <div class="outs"><i id="o1"></i><i id="o2"></i><i id="o3"></i></div></div>
      <div class="ct r" style="--tc:${col(H.color)}"><b id="cH">0</b><span>${esc(H.name)}</span></div></div>
    <div class="cvs"><div class="cpl" id="cBat"></div><span>VS</span><div class="cpl" id="cPit"></div></div>
    <div class="cnow" id="cNow">경기 시작!</div>
    <div class="pbp" id="pbp"></div>
    <div class="cctl"><button class="btn sm" id="cPlay">멈춤</button><button class="btn sm" data-sp="700">느리게</button><button class="btn sm on" data-sp="380">보통</button><button class="btn sm" data-sp="120">빠르게</button><button class="btn sm" id="pbpall">끝까지</button></div>
    <button class="btn ghost wide" id="mclose">닫기</button></div>`;
  $('#modal').classList.add('on'); $('#mclose').onclick = closeModal;
  const box = $('#pbp'); let k = 0, speed = 380, playing = true; const hs = {}, ps = {};
  const plc = (id, role, line) => id && PL[id] ? `${avatar(id, 58)}<div><em>${role}</em><b>${esc(PL[id].dn)}</b><span>${line}</span></div>` : '';
  const step = () => {
    if (k >= log.length) { stop(); if (k === log.length) { k++; $('#cNow').innerHTML = `경기 종료 — ${esc(A.name)} ${g.s[0]} : ${g.s[1]} ${esc(H.name)}`; $('#cNow').className = 'cnow fin'; } return; }
    const [kind, t, inn, half, outs, bases, sa, sh, bid, pid] = log[k++];
    $('#cA').textContent = sa; $('#cH').textContent = sh; $('#cInn').textContent = inn + '회' + (half ? '말 ▼' : '초 ▲');
    [1, 2, 3].forEach(n => { $('#b' + n).setAttribute('class', bases & (1 << (n - 1)) ? 'on' : ''); $('#o' + n).className = outs >= n ? 'on' : ''; });
    if (bid && PL[bid] && PL[bid].k === 'H' && ['k', 'bb', 'hr', 'h', 'e', 'dp', 'out', 'sf'].includes(kind)) {
      const x = hs[bid] || (hs[bid] = [0, 0]); if (kind !== 'bb' && kind !== 'sf') x[0]++; if (kind === 'h' || kind === 'hr') x[1]++;
      $('#cBat').innerHTML = plc(bid, '타자', `오늘 ${x[1]}/${x[0]} · 타율 ${avgStr(avgOf(S, bid))}`);
    }
    if (pid && PL[pid]) { const y = ps[pid] || (ps[pid] = [0]); if (kind === 'k') y[0]++; $('#cPit').innerHTML = plc(pid, '투수', `오늘 ${y[0]}삼진 · ERA ${eraOf(S, pid).toFixed(2)}`); }
    const cls = kind === 'inn' ? 'inn' : kind === 'hr' ? 'hr' : (kind === 'run' || kind === 'end') ? 'run' : kind === 'sub' ? 'sub' : '';
    if (kind === 'inn') $('#cBat').innerHTML = `<div><em>타자</em><b>${half ? esc(H.name) : esc(A.name)} 공격</b></div>`;
    if (kind !== 'inn') { $('#cNow').innerHTML = `${badge(kind)} ${esc(t)}`; $('#cNow').className = 'cnow ' + cls; }
    box.insertAdjacentHTML('afterbegin', `<div class="${cls}">${kind === 'inn' ? '— ' + esc(t) + ' —' : badge(kind) + ' ' + esc(t)}</div>`);
  };
  const stop = () => { clearInterval(UI.pbpT); playing = false; $('#cPlay').textContent = '재생'; };
  const start = () => { clearInterval(UI.pbpT); playing = true; $('#cPlay').textContent = '멈춤'; UI.pbpT = setInterval(step, speed); };
  $('#cPlay').onclick = () => { if (k > log.length) return; playing ? stop() : start(); };
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.classList.toggle('on', x === b)); if (playing) start(); });
  $('#pbpall').onclick = () => { stop(); while (k <= log.length) step(); };
  if (seen) { while (k <= log.length) step(); } else start();
}

/* ---------- 자동 진행 멈춤 → 중간 정산 ---------- */
function newsKind(t) {
  if (/부상 —|결장/.test(t)) return ['inj', '부상'];
  if (/회복/.test(t)) return ['up', '복귀'];
  if (/하락|저하|난조|슬럼프|감기|누적|흔들/.test(t)) return ['down', '하락'];
  if (/지원금/.test(t)) return ['etc', '지원'];
  if (/휴식/.test(t)) return ['etc', '휴식'];
  if (/상승|폭발|호투|최고|성과|든든|교정|힘이|반전|응원/.test(t)) return ['up', '상승'];
  if (/우승|시작|종료|대진|교체/.test(t)) return ['etc', '리그'];
  return ['etc', '소식'];
}
function evCard(n, small) {
  const [k, l] = newsKind(n.t);
  return `<div class="evc ${small ? 'sm' : ''}">${n.id && PL[n.id] ? avatar(n.id, small ? 32 : 40) : ''}<div><i class="nk ${k}">${l}</i>${small && n.ti != null && S.teams[n.ti] ? `<span class="sub">${esc(S.teams[n.ti].name)}</span> ` : ''}${esc(n.t)}</div></div>`;
}
function diffStat(id, snap) {
  const a = S.ps[id], b = snap && snap[id];
  if (!a) return null; return a.map((v, i) => v - (b ? b[i] || 0 : 0));
}
function pauseView(my) {
  const P = S.pause; if (!P || UI.seenPause === P.id) return '';
  const snap = S.autoSnap || { ps: {}, rec: [] };
  const T = S.teams[my]; const r0 = snap.rec[my] || [0, 0, 0, 0, 0];
  const w = T.W - r0[0], l = T.L - r0[1], d = T.D - r0[2], rs = T.RS - r0[3], ra = T.RA - r0[4];
  const games = P.to - P.from + 1;
  const evs = (S.news || []).filter(n => n.d > P.from && n.d <= P.to + 1);
  const mine = evs.filter(n => n.ti === my);
  const humans = new Set(S.teams.map((t, i) => t.ai ? -1 : i));
  const others = evs.filter(n => n.ti !== my && humans.has(n.ti));
  const all = [...T.roster, ...T.froster];
  const bat = all.filter(id => PL[id].k === 'H').map(id => { const x = diffStat(id, snap.ps); if (!x || !x[1]) return null;
    const [G, PA, AB, H, D2, D3, HR, R, RBI, BB] = x; const tb = H + D2 + 2 * D3 + 3 * HR; const ops = (H + BB) / PA + (AB ? tb / AB : 0);
    return { id, v: ops * PA, t: `${AB ? avgStr(H / AB) : '-'} · ${HR}홈런 ${RBI}타점` }; }).filter(Boolean).sort((a, b) => b.v - a.v).slice(0, 3);
  const pit = all.filter(id => PL[id].k === 'P').map(id => { const x = diffStat(id, snap.ps); if (!x || !x[6]) return null;
    const [G, GS, W, L, SV, HLD, OUTS, H, ER, BB, SO] = x; const era = ER * 27 / OUTS;
    return { id, v: OUTS / 3 * (5 - era) + SV * 2 + W * 2, t: `ERA ${era.toFixed(2)} · ${W}승 ${SV ? SV + '세 ' : ''}${ipStr(OUTS)}이닝` }; }).filter(Boolean).sort((a, b) => b.v - a.v).slice(0, 3);
  const st = standings(S);
  const bigs = mine.concat(others).filter(n => n.big && n.d === P.to + 1);
  const title = P.why === 'event' ? (bigs[0] ? '자동 진행 멈춤 · ' + (newsKind(bigs[0].t)[1] === '부상' ? '부상 발생' : '중요 소식') : '자동 진행을 멈췄어요') : P.why === 'end' ? '정규시즌이 끝났어요' : `${games}경기를 진행했어요`;
  return `<section class="pause">
    <div class="ph1">${title}</div>
    <div class="ph2">${P.from + 1}일째 ~ ${P.to + 1}일째 · ${games}경기</div>
    <div class="tiles"><div><b>${w}-${l}${d ? '-' + d : ''}</b><span>이 기간 승패</span></div><div><b>${rs}</b><span>득점</span></div><div><b>${ra}</b><span>실점</span></div><div><b>${st.findIndex(x => x.i === my) + 1}위</b><span>현재 순위</span></div><div><b>${T.W}-${T.L}</b><span>시즌</span></div></div>
    ${bigs.length ? `<div class="bigev">${bigs.map(n => evCard(n)).join('')}</div>` : ''}
    ${mine.filter(n => !bigs.includes(n)).length ? `<h4>우리 팀 소식</h4>${mine.filter(n => !bigs.includes(n)).slice(0, 6).map(n => evCard(n)).join('')}` : ''}
    ${others.filter(n => !bigs.includes(n)).length ? `<h4>다른 감독 팀 소식</h4>${others.filter(n => !bigs.includes(n)).slice(0, 4).map(n => evCard(n, true)).join('')}` : ''}
    ${bat.length ? `<h4>이 기간 잘 친 타자</h4>${bat.map(x => `<button class="prl2 good" data-pid="${esc(x.id)}">${avatar(x.id, 38)}<div class="pi"><b>${esc(PL[x.id].dn)}</b><div class="tl">${x.t}</div></div></button>`).join('')}` : ''}
    ${pit.length ? `<h4>이 기간 잘 던진 투수</h4>${pit.map(x => `<button class="prl2 good" data-pid="${esc(x.id)}">${avatar(x.id, 38)}<div class="pi"><b>${esc(PL[x.id].dn)}</b><div class="tl">${x.t}</div></div></button>`).join('')}` : ''}
    <h4>순위</h4><div class="mstand">${st.map((x, k) => `<div class="${x.i === my ? 'me' : ''}"><span>${k + 1}</span><i style="background:${col(S.teams[x.i].color)}"></i><b>${esc(S.teams[x.i].name)}</b><em>${x.W}-${x.L}${x.D ? '-' + x.D : ''}</em><em>${x.gb || '-'}</em></div>`).join('')}</div>
    <div class="row">${isHost() && P.left > 0 ? `<button class="btn primary" data-resume="${P.left}">이어서 진행 (${P.left}경기)</button>` : ''}<button class="btn ghost" id="pclose">확인</button></div>
  </section>`;
}

/* ---------- 시작 ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const pb = e.target.closest && e.target.closest('#modal [data-pid]');
  if (pb && pb.id !== 'dopick') playerModal(pb.dataset.pid);
});
render();
(async () => {
  if (!sb) return;
  try {
    let { data } = await sb.auth.getSession();
    let user = data && data.session && data.session.user;
    if (!user) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      user = r.data.user;
    }
    UID = user.id;
    loadMedia();
  } catch (e) { AUTH_ERR = '익명 로그인에 실패했어요: ' + (e.message || e); }
  render();
})();
</script>
</body>
